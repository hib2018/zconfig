name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache-dependency-path: |
            tui/go.sum
            tests/go.sum
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(find tui tests -type f -name '*.go' -exec gofmt -l {} +)"
          test -z "$unformatted"
      - name: Vet
        run: go vet ./tui/... ./tests/...
      - name: Test
        run: go test ./tui/... ./tests/...
      - name: Race test
        run: go test -race ./tui/... ./tests/...
